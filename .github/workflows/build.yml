name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not |Execution failed|Unresolved|not found|Caused by" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-400)"
            done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "R56-video.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: R56-video-apk
          path: R56-video.apk
